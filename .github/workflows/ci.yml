name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Check file line count limit (<= 300 lines)
        run: |
          while IFS= read -r f; do
            n=$(wc -l < "$f" | tr -d ' ')
            if [ "$n" -gt 300 ]; then
              echo "::error file=$f::File exceeds 300 lines ($n lines)"
              exit 1
            fi
          done < <(find Sources -name '*.swift')

      - name: Build Debug & Run Unit Tests
        run: |
          swift build
          swift run MSnipTests

      - name: Package Universal Binary MSnip.app
        run: bash scripts/bundle.sh

      - name: Upload Packaged Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MSnip-macOS-Universal
          path: dist/MSnip-v*-macOS.zip
